<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360">
  <!-- FlowRate brand color swatch — colors sampled from src/FlowRate/Assets/AppIcon.ico -->
  <style>
	text { font-family: Segoe UI, Helvetica Neue, Arial, sans-serif; }
	.name { font-size: 18px; font-weight: 600; fill: #0B2B31; }
	.hex  { font-size: 15px; fill: #5A6E72; }
	.title{ font-size: 24px; font-weight: 700; fill: #0B2B31; }
  </style>
  <rect width="800" height="360" fill="#FFFFFF"/>
  <text x="30" y="42" class="title">FlowRate Brand Palette</text>

  <!-- Row 1: primary icon colors -->
  <rect x="30"  y="70" width="140" height="90" rx="10" fill="#009090"/>
  <text x="30"  y="185" class="name">Deep Teal</text>
  <text x="30"  y="206" class="hex">#009090</text>

  <rect x="190" y="70" width="140" height="90" rx="10" fill="#00A0AB"/>
  <text x="190" y="185" class="name">Brand Teal</text>
  <text x="190" y="206" class="hex">#00A0AB</text>

  <rect x="350" y="70" width="140" height="90" rx="10" fill="#00A0B0"/>
  <text x="350" y="185" class="name">Teal Cyan</text>
  <text x="350" y="206" class="hex">#00A0B0</text>

  <rect x="510" y="70" width="140" height="90" rx="10" fill="#00B4C8"/>
  <text x="510" y="185" class="name">Flow Cyan</text>
  <text x="510" y="206" class="hex">#00B4C8</text>

  <rect x="670" y="70" width="100" height="90" rx="10" fill="#F0F4F4" stroke="#D5DDDE"/>
  <text x="670" y="185" class="name">Ice White</text>
  <text x="670" y="206" class="hex">#F0F4F4</text>

  <!-- Row 2: supporting web colors -->
  <rect x="30"  y="235" width="140" height="70" rx="10" fill="#0B2B31"/>
  <text x="30"  y="330" class="name">Ink (dark bg)</text>
  <text x="30"  y="351" class="hex">#0B2B31</text>

  <rect x="190" y="235" width="140" height="70" rx="10" fill="#104650"/>
  <text x="190" y="330" class="name">Deep Sea</text>
  <text x="190" y="351" class="hex">#104650</text>

  <rect x="350" y="235" width="140" height="70" rx="10" fill="#0090A0"/>
  <text x="350" y="330" class="name">Mid Teal</text>
  <text x="350" y="351" class="hex">#0090A0</text>

  <rect x="510" y="235" width="140" height="70" rx="10" fill="#5A6E72"/>
  <text x="510" y="330" class="name">Slate Gray</text>
  <text x="510" y="351" class="hex">#5A6E72</text>

  <rect x="670" y="235" width="100" height="70" rx="10" fill="#FFFFFF" stroke="#D5DDDE"/>
  <text x="670" y="330" class="name">White</text>
  <text x="670" y="351" class="hex">#FFFFFF</text>
</svg>
