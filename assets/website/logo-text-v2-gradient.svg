<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 0 800 200">
  <!-- FlowRate text logo — Variation 2: Horizontal gradient (deep teal to cyan) -->
  <defs>
	<linearGradient id="flowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
	  <stop offset="0%" stop-color="#009090"/>
	  <stop offset="55%" stop-color="#00A0B0"/>
	  <stop offset="100%" stop-color="#00B4C8"/>
	</linearGradient>
  </defs>
  <rect width="800" height="200" fill="none"/>
  <text x="400" y="128" text-anchor="middle"
		font-family="Segoe UI, Helvetica Neue, Arial, sans-serif"
		font-size="96" font-weight="700" fill="url(#flowGrad)">FlowRate</text>
</svg>
