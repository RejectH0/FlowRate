<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 0 800 200">
  <!-- FlowRate text logo — Variation 4: Dark badge with white text and speed-line accents -->
  <defs>
	<linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
	  <stop offset="0%" stop-color="#0B2B31"/>
	  <stop offset="100%" stop-color="#104650"/>
	</linearGradient>
  </defs>
  <rect x="20" y="20" width="760" height="160" rx="24" fill="url(#badgeGrad)"/>
  <!-- speed lines -->
  <rect x="56"  y="86"  width="72" height="8"  rx="4" fill="#00B4C8" opacity="0.9"/>
  <rect x="72"  y="104" width="56" height="8"  rx="4" fill="#00A0B0" opacity="0.7"/>
  <rect x="88"  y="122" width="40" height="8"  rx="4" fill="#009090" opacity="0.5"/>
  <text x="440" y="132" text-anchor="middle"
		font-family="Segoe UI, Helvetica Neue, Arial, sans-serif"
		font-size="88" font-weight="700" fill="#F0F4F4">FlowRate</text>
</svg>
